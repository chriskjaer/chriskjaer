name: Refresh books

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-books
  cancel-in-progress: false

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Check for Goodreads changes
        id: books
        run: |
          set -eu
          make data FORCE=1
          ./scripts/books_json.sh src/data/books "$RUNNER_TEMP/books.json"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            --header 'Cache-Control: no-cache' \
            https://chriskjaer.com/books.json \
            --output "$RUNNER_TEMP/live-books.json"

          if cmp -s "$RUNNER_TEMP/books.json" "$RUNNER_TEMP/live-books.json"; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "Goodreads data is unchanged"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
            echo "Goodreads data changed"
          fi
      - name: Trigger a fresh Cloudflare Pages build
        if: steps.books.outputs.changed == 'true'
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_DEPLOY_HOOK" || {
            echo "missing CLOUDFLARE_DEPLOY_HOOK secret" >&2
            exit 1
          }
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            --request POST "$CLOUDFLARE_DEPLOY_HOOK" \
            --output "$RUNNER_TEMP/cloudflare-deploy.json"
